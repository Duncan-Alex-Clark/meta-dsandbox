# Media framework needed by the Xilinx video pipeline and the OV5647 sensor.
CONFIG_MEDIA_SUPPORT=y
CONFIG_MEDIA_CAMERA_SUPPORT=y
CONFIG_VIDEO_DEV=y
CONFIG_VIDEO_V4L2=y
CONFIG_MEDIA_CONTROLLER=y

# The OV5647 sensor driver is deliberately NOT built here.
#
# It is supplied out of tree by recipes-kernel/ov5647-patched, carrying the
# KV260 I2C timing fix: upstream's sensor_oe_enable_regs writes 0xff to
# register 0x3001, which leaves the sensor unable to accept another SCCB
# transfer for tens of milliseconds, so probe intermittently fails with -EIO
# ("camera not available, check power").
#
# This must stay disabled.  Built in (=y) the in-tree driver claims the sensor
# at boot and the out-of-tree module can never bind; built as a module (=m)
# there would be two ov5647.ko providing the same module name and depmod would
# pick between them arbitrarily.
# CONFIG_VIDEO_OV5647 is not set
