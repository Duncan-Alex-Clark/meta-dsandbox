# Userspace I/O, built in rather than modular.
#
# The csi2mix overlay exposes the Xilinx Video Mixer as a "generic-uio"
# node so the application can drive it directly.  The mixer has no V4L2
# subdevice driver, and its DRM driver (xlnx_mixer.c) can only start the
# core from a KMS modeset, which this design cannot perform: the mixer
# output feeds the frame buffer write, so the DRM device has no connector.
#
# uio_pdrv_genirq has an empty OF match table that is filled from a module
# parameter, so it also needs this on the kernel command line:
#
#     uio_pdrv_genirq.of_id=generic-uio
#
# Built in, that parameter is parsed during early boot, before the driver
# registers, so the mixer binds as soon as the overlay is applied.
CONFIG_UIO=y
CONFIG_UIO_PDRV_GENIRQ=y
