# The Xilinx Video Gamma LUT driver is deliberately NOT built in tree.
#
# It is supplied out of tree by recipes-kernel/gamma-patched, carrying a patch
# that lets it report MEDIA_BUS_FMT_RBG101010_1X30 when the IP is built 10 bits
# wide.  Upstream hard-codes the 8-bit RGB code on the sink pad and as the
# default format, which makes the frame buffer's xbgr2101010 format
# unreachable even though the LUT itself is programmed at full 10-bit depth.
#
# This must stay disabled.  Built in (=y) the in-tree driver claims the IP and
# the out-of-tree module can never bind; as a module (=m) there would be two
# xilinx-gamma.ko providing the same module name.
# CONFIG_VIDEO_XILINX_GAMMA is not set
